[supervisord]
nodaemon=true

[program:master]
directory=nap-backend
command=uv run uvicorn nap.master.asgi:APP --port 18000
autostart=true
autorestart=true
environment=LOG__FILE="logs/nap-master.log"

[program:knowledge]
directory=nap-backend
command=uv run uvicorn nap.knowledge.asgi:APP --port 18001
autostart=true
autorestart=true
environment=LOG__FILE="logs/nap-knowledge.log"

[program:frontend]
command=npm -C nap-frontend run dev
autostart=true
autorestart=true
