[project]
name = "nap-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "boto3>=1.43.118",
    # "chromadb>=1.5.9",
    # "markitdown>=0.1.7",
    "markitdown>=0.1.7",
    "onnxruntime==1.20.1",
    "pydantic>=2.13.5",
    "pymilvus>=3.0.2",
    "pystonic[orm,asgi,agent]>=2.0.4",
    "redis>=8.1.0",
    "sse-starlette>=3.4.11",
]
[project.scripts]
nap = "nap.cmd.root:main"

[[tool.uv.index]]
name = "tencent"
url = "http://mirrors.cloud.tencent.com/pypi/simple"

# [tool.uv.sources]
# pystonic = { git = "https://github.com/BytemanD/pystonic.git" }

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nap"]


[tool.ruff.lint.isort]
known-first-party = ["nap"]
