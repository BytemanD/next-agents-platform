[project]
name = "nap-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "chromadb>=1.5.9",
    # "dashscope>=1.27.5",
    "dashscope>=1.27.5",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "loguru>=0.7.3",
    # "markitdown>=0.1.7",
    "markitdown>=0.1.7",
    "onnxruntime==1.20.1",
    "openai>=3.8.0",
    "openai-agents>=0.22.0",
    "portalocker>=4.3.2",
    "pydantic>=2.13.5",
    "pystonic",
    "rich>=15.0.0",
    "sqlmodel>=0.0.42",
    "sse-starlette>=3.4.11",
    "uvicorn>=0.52.4",
]
[project.scripts]
nap = "nap.cmd.root:main"

[[tool.uv.index]]
name = "tencent"
url = "http://mirrors.cloud.tencent.com/pypi/simple"

[tool.uv.sources]
pystonic = { git = "https://github.com/BytemanD/pystonic.git" }

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nap"]
